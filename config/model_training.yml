# Model training and label configuration.
#
# lookahead_minutes: For 1-minute bars, how many minutes ahead to compare price
# when building the binary direction target (see `generate_target`).

lookahead_minutes: 15
# Used by vectorbt backtest in `src/model.py` (percent units).
stop_loss_pct: 0.25
take_profit_pct: 0.35
# Triple-barrier labeling: multiples of `natr_col` at the entry bar (see `add_long_target`).
take_profit_natr: 2.0
stop_loss_natr: 1.5
natr_col: natr_5m

# XGBoost (standard): chronological validation tail + early stopping. Omitted or null
# keys use defaults in src/constants.py.
# Set `early_stopping_rounds` to 0 to disable early stopping (full train fit).
early_stopping_rounds: 50
validation_fraction: 0.2

# Target (label) configuration
#
# `long_target` in `src/features/long_target.py` uses:
# - 0: stop-loss hit first
# - 1: hold / no-action
# - 2: take-profit hit first
#
# Class weights: sample_weight during fit only. For balanced inference on long entries:
# - hold: baseline (majority class)
# - stop_loss: moderate (learn what to avoid; not used for entries)
# - take_profit: highest (aligns with entry_tp_prob gate at inference)
target:
  classes:
    stop_loss:
      num: 0
      weight: 3.0
    hold:
      num: 1
      weight: 1.0
    take_profit:
      num: 2
      weight: 4.5

# XGBoost hyperparameters (merged over code defaults in src/constants.py).
# Tuning guide:
# - More trades / recall: lower min_child_weight, lower gamma, raise take_profit weight
# - Fewer trades / precision: raise min_child_weight, raise gamma, raise entry_tp_prob
# - Better calibration (lower mlogloss): lower learning_rate, more n_estimators
xgboost:
  learning_rate: 0.02
  n_estimators: 2500
  max_depth: 4
  min_child_weight: 8
  gamma: 0.8
  subsample: 0.8
  colsample_bytree: 0.8

# Training-time backtest gates (take-profit probability). Tune with run_backtest.py sweep.
inference:
  entry_tp_prob: 0.72
  exit_tp_prob: 0.35
