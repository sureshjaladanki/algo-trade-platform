# Period configuration for market feature computation.
#
# Notes:
# - Features are computed on 5-minute resampled candles.
# - `roc.period` is a lookback in *5m bars*.

roc:
  period: 3

# Intraday session boundaries (minute_of_day = hour*60 + minute).
# Values represent the *last* minute_of_day included in each session window.
trading_sessions:
  initial_range: 599   # 09:59
  morning_trend: 689   # 11:29
  midday_dax: 749      # 12:29
  london_overlap: 869  # 14:29
  closing_push: 908    # 15:08
  square_off: 929      # 15:29

