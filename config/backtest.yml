# Default vectorBT backtest settings (see `src/backtest.py`).
#
# Percent-style stops for vectorbt `sl_stop` (divided by 100 in code).
stop_loss_pct: 0.25
# NATR signal masks (same semantics as training backtest in `src/model.py`):
# - natr_col: column on the bar dataframe used for ATR fraction thresholds
# - stop_loss_natr: single-bar return exit when return <= -natr * stop_loss_natr
# - take_profit_natr / take_profit_pct: require natr * take_profit_natr > take_profit_pct to allow entries
natr_col: natr_5m
stop_loss_natr: 1.5
take_profit_natr: 2.0
take_profit_pct: 0.35
freq: "1min"
# 0.07% is the average feee + 0.03% buffer for slippage for intraday equity in India
fees: 0.001
slippage: 0.0005
init_cash: 100000
metric_prefix: "backtest_"
