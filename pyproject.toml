[project]
name = "algo-trade-platform"
version = "0.1.0"
description = "Retail India desk — forced-flow event book (NSE)"
authors = [
    {name = "Author",email = "author@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "polars (>=1.43.1,<2.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
]


[tool.poetry]
packages = [{ include = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.6.2,<5.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
